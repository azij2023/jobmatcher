name: 30-Minute Job Feed Sync

on:
  schedule:
    - cron: '*/30 * * * *'  # Runs automatically every 30 minutes
  workflow_dispatch:        # Allows manual 1-click trigger from GitHub Actions

permissions:
  contents: write

jobs:
  feed-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Job Feed Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          python hourly_pipeline.py

      - name: Commit and Push Fresh Jobs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json docs/data.json data.js docs/data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(pipeline): sync verified fresh job listings [skip ci]" && git push)
