name: Real-Time Live Job Feed Sync

on:
  schedule:
    - cron: '7,22,37,52 * * * *'  # Request collection every 15 minutes, away from the hour
  push:
    paths:
      - 'collectors/**'
      - 'matching/**'
      - 'processing/**'
      - 'hourly_pipeline.py'
      - 'profile.json'
      - 'requirements.txt'
      - '.github/workflows/hourly_sync.yml'
  workflow_dispatch:        # Allows instant 1-click trigger from GitHub Actions
  repository_dispatch:      # Allows instant trigger via incoming webhooks from external ATS/APIs
    types: [live_job_alert, ats_webhook, instant_sync]

permissions:
  contents: write

concurrency:
  group: "feed-sync"
  cancel-in-progress: false

jobs:
  feed-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Feed Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          python hourly_pipeline.py

      - name: Commit and Push Fresh Jobs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json docs/data.json data.js docs/data.js
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(pipeline): hourly sync fresh job listings (1m-5d recency)"
            git pull --rebase origin main || true
            git push origin main
          fi
